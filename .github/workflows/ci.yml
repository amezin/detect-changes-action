name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '37 9 * * *'

defaults:
  run:
    shell: bash

jobs:
  dist-check:
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json

      - run: npm ci
      - run: npm run build

      - id: diff
        run: git diff --exit-code --color --ignore-space-at-eol --text dist/

      - if: ${{ always() && steps.diff.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  eslint:
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json

      - run: npm ci
      - run: npm run build
      - run: npm run lint

  prettier:
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json

      - run: npm ci
      - run: npm run format && git diff --color --exit-code

  actionlint:
    runs-on: ubuntu-slim

    permissions:
      contents: read

    env:
      # renovate: datasource=github-releases depName=rhysd/actionlint
      ACTIONLINT_VERSION: 1.7.12

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - working-directory: ${{ runner.temp }}
        run: |
          wget "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir actionlint
          tar -C actionlint -xf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$(pwd)/actionlint" >>"$GITHUB_PATH"
          wget "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/.github/actionlint-matcher.json"
          echo "::add-matcher::$(pwd)/actionlint-matcher.json"

      - run: actionlint -verbose -color

  test:
    runs-on: ubuntu-latest

    needs:
      - dist-check

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - id: simple-match
        uses: ./.
        with:
          files: action.yml
          base: efc72ea7731bb189c5c9c5dfa1836eb281732f48

      - run: test "$CHANGED" = "true"
        env:
          CHANGED: ${{ steps.simple-match.outputs.changed }}

      - id: all-negated
        uses: ./.
        with:
          files: |
            !action.yml
          base: efc72ea7731bb189c5c9c5dfa1836eb281732f48

      - run: test "$CHANGED" = "true"
        env:
          CHANGED: ${{ steps.all-negated.outputs.changed }}

      - id: current-pr-files
        if: github.event.pull_request
        run: |
          echo 'files<<EOF' >>"$GITHUB_OUTPUT" && gh pr diff "$PR_NUM" --name-only | tee -a "$GITHUB_OUTPUT"
          echo 'EOF' >>"$GITHUB_OUTPUT"
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

      - id: current-pr
        if: steps.current-pr-files.outcome == 'success'
        uses: ./.
        with:
          files: ${{ steps.current-pr-files.outputs.files }}
          ignore-removed: true

      - run: test "$CHANGED" = "true"
        if: steps.current-pr.outcome == 'success'
        env:
          CHANGED: ${{ steps.current-pr.outputs.changed }}

      - id: current-pr-negate-files
        if: github.event.pull_request
        run: |
          echo 'files<<EOF' >>"$GITHUB_OUTPUT" && gh pr diff "$PR_NUM" --name-only | sed 's/^/!/' | tee -a "$GITHUB_OUTPUT"
          echo 'EOF' >>"$GITHUB_OUTPUT"
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

      - id: current-pr-negate
        if: steps.current-pr-negate-files.outcome == 'success'
        uses: ./.
        with:
          files: ${{ steps.current-pr-negate-files.outputs.files }}
          ignore-removed: true

      - run: test "$CHANGED" = "false"
        if: steps.current-pr-negate.outcome == 'success'
        env:
          CHANGED: ${{ steps.current-pr-negate.outputs.changed }}

      - id: truncated
        uses: ./.
        with:
          repository: torvalds/linux
          files: this-does-not-even-exist
          base: v5.4
          head: v5.5

      - run: test "$CHANGED" = "true"
        env:
          CHANGED: ${{ steps.truncated.outputs.changed }}

      - id: no-match
        uses: ./.
        with:
          files: this-does-not-even-exist
          base: efc72ea7731bb189c5c9c5dfa1836eb281732f48

      - run: test "$CHANGED" = "false"
        env:
          CHANGED: ${{ steps.no-match.outputs.changed }}

      - id: no-match-negated
        uses: ./.
        with:
          files: |
            action.yml
            !*
          base: efc72ea7731bb189c5c9c5dfa1836eb281732f48

      - run: test "$CHANGED" = "false"
        env:
          CHANGED: ${{ steps.no-match-negated.outputs.changed }}

      - id: empty
        uses: ./.
        with:
          files: |
            # empty, only comment
          base: efc72ea7731bb189c5c9c5dfa1836eb281732f48

      - run: test "$CHANGED" = "false"
        env:
          CHANGED: ${{ steps.empty.outputs.changed }}

      - id: removal
        uses: ./.
        with:
          files: .github/dependabot.yml
          head: fda90f4116b0a18ee68629ceb6dbdeb530bc8b31
          base: ffa4731f9853fe8dd1f14e0adb7ace7185560ded
          ignore-removed: false

      - run: test "$CHANGED" = "true"
        env:
          CHANGED: ${{ steps.removal.outputs.changed }}

      - id: removal-ignored
        uses: ./.
        with:
          files: .github/dependabot.yml
          head: fda90f4116b0a18ee68629ceb6dbdeb530bc8b31
          base: ffa4731f9853fe8dd1f14e0adb7ace7185560ded
          ignore-removed: true

      - run: test "$CHANGED" = "false"
        env:
          CHANGED: ${{ steps.removal-ignored.outputs.changed }}
